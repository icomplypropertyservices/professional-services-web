# iComply Professional Services
# Site name: icomply-professional-services
# Netlify host: https://icomply-professional-services.netlify.app
# NETLIFY_SITE_ID: dc86da59-3989-4b57-bac1-d214b9ca2072
# Canonicals point at https://icomplyprofessionalservices.co.uk. Apex DNS, merges and deploys are Jack-go only (G11).
# NETLIFY_AUTH_TOKEN stays in GitHub Actions secrets.

[build]
  command = "php website/bin/static-export.php && php website/bin/check-static-export.php"
  publish = "dist"

[build.environment]
  PHP_VERSION = "8.3"
  SITE_URL = "https://icomplyprofessionalservices.co.uk"
  # Review-first: no ×place matrix pages on preview until content is approved.
  XPLACE_TOWN_LIMIT = "0"
  NETLIFY_SITE_ID = "dc86da59-3989-4b57-bac1-d214b9ca2072"

# Publish directory is dist/. These rules 404 paths that must not be public
# if a future publish root is wrong. They do not attach a custom domain.
[[redirects]]
  from = "/website/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/config/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/includes/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/bin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/templates/*"
  to = "/404.html"
  status = 404

# No X-Robots-Tag here: every live page is indexable (Jack's G10, 19 Oct 2026).
[[headers]]
  for = "/*"
  [headers.values]
    X-Site = "icomply-professional-services"
