name: Netlify primary on main

on:
  push:
    branches: [main]
  workflow_dispatch:

# PREVIEW-ONLY Netlify site (no apex DNS).
# `--prod` updates this site's Netlify primary URL:
#   https://icomply-professional-services.netlify.app
# It does NOT attach icomplyprofessionalservices.co.uk — apex stays off (Jack-go only).
# SITE_ID must remain dc86da59-3989-4b57-bac1-d214b9ca2072
# PR drafts still use netlify-preview.yml (--alias pr-N / preview).

permissions:
  contents: read

jobs:
  primary-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Static export
        env:
          SITE_URL: https://icomplyprofessionalservices.co.uk
          XPLACE_TOWN_LIMIT: "0"
        run: |
          php website/bin/static-export.php
          php website/bin/check-static-export.php

      - name: Deploy to Netlify primary URL (preview site; not apex)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID must be set on the repo. No token is stored in git."
            exit 1
          fi
          if [ "${NETLIFY_SITE_ID}" != "dc86da59-3989-4b57-bac1-d214b9ca2072" ]; then
            echo "Refusing deploy: SITE_ID is not the Professional Services preview site."
            exit 1
          fi
          # --prod = promote to this site's primary Netlify host only.
          # Apex DNS icomplyprofessionalservices.co.uk is not attached and must stay off.
          npx --yes netlify-cli deploy --dir=dist --site="${NETLIFY_SITE_ID}" --prod --no-build --message "main primary ${GITHUB_SHA}"
