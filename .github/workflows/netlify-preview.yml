name: Netlify preview

on:
  pull_request:
  workflow_dispatch:

# PREVIEW ONLY. Never pass --prod. Never attach icomplyprofessionalservices.co.uk.
# Site: icomply-professional-services
# https://icomply-professional-services.netlify.app
# SITE_ID: dc86da59-3989-4b57-bac1-d214b9ca2072

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Static export
        env:
          SITE_URL: https://icomplyprofessionalservices.co.uk
          XPLACE_TOWN_LIMIT: "50"
        run: |
          php website/bin/static-export.php
          php website/bin/check-static-export.php

      - name: Draft deploy to preview site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID must be set on the repo. No token is stored in git."
            exit 1
          fi
          if [ "${NETLIFY_SITE_ID}" != "dc86da59-3989-4b57-bac1-d214b9ca2072" ]; then
            echo "Refusing deploy: SITE_ID is not the Professional Services preview site."
            exit 1
          fi
          ALIAS="preview"
          if [ -n "${PR_NUMBER}" ] && [ "${PR_NUMBER}" != "null" ]; then
            ALIAS="pr-${PR_NUMBER}"
          fi
          npx --yes netlify-cli deploy --dir=dist --site="${NETLIFY_SITE_ID}" --alias "${ALIAS}" --message "preview ${GITHUB_SHA}"
